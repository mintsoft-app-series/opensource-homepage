# Cloudflare Workers 정적 에셋 — `npm run deploy` 가 빌드 후 dist/ 를 올린다.
# (wrangler 4.16x 부터 Pages 신규 생성이 Workers 로 위임되어 Workers 정적 에셋으로 운영한다.)
name = "mintsoft-oss"
compatibility_date = "2026-10-01"

# 커스텀 도메인 — 배포 시 DNS 레코드와 인증서를 Cloudflare 가 자동으로 만든다.
# ⚠️ 반드시 [assets] 테이블보다 위에 둘 것(아래에 두면 assets.routes 로 해석된다).
routes = [{ pattern = "oss.mint-soft.com", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
